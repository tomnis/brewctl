# Local development only: all three services on one host, hardware in mock mode.
# Production is split across two hosts -- see deploy/device/ and deploy/control/.
services:
  hardware:
    build: ./backend
    environment:
      - BREWCTL_IS_PROD=false
      - BREWCTL_MODE=hardware
      - BREWCTL_SCALE_MAC_ADDRESS=${BREWCTL_SCALE_MAC_ADDRESS}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app

  api:
    build: ./backend
    environment:
      - BREWCTL_IS_PROD=false
      - BREWCTL_MODE=api
      - BREWCTL_HARDWARE_URL=http://hardware:8000
      - BREWCTL_INFLUXDB_TOKEN=${BREWCTL_INFLUXDB_TOKEN}
      - BREWCTL_INFLUXDB_URL=${BREWCTL_INFLUXDB_URL}
      - BREWCTL_INFLUXDB_ORG=${BREWCTL_INFLUXDB_ORG}
      - BREWCTL_VALVE_INTERVAL_SECONDS=${BREWCTL_VALVE_INTERVAL_SECONDS}
      # Bare names: passed through only when set, so the api's own defaults stay the
      # single source of truth rather than being restated here. deploy/control/app.yaml
      # is where they are set for production.
      - BREWCTL_VESSEL_WEIGHT_GRAMS
      - BREWCTL_TARGET_WEIGHT_GRAMS
      # AIBrewStrategy. Any OpenAI-compatible server; defaults to a local Ollama,
      # which from inside this container is the host, not localhost.
      - BREWCTL_LLM_BASE_URL=${BREWCTL_LLM_BASE_URL:-http://host.docker.internal:11434}
      - BREWCTL_LLM_MODEL=${BREWCTL_LLM_MODEL:-llama3.2:3b}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      # Vite's envPrefix is BREWCTL_FRONTEND_, so only these two reach the
      # bundle. In dev the api is on a different port than vite, so the URL must
      # be set explicitly; in production it is unset and resolves same-origin.
      - BREWCTL_FRONTEND_API_URL=${BREWCTL_FRONTEND_API_URL:-http://localhost:8000/api}
      - BREWCTL_FRONTEND_IS_PROD=false
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src