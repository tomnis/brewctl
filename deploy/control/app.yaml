# the deployment manifest.
#
# This file plus deploy/control/image.tag IS the desired state. `PUT
# /api/v2.0/app/id/brewctl` takes a custom app's entire compose config as
# `custom_compose_config_string`, so deploy/control/apply.sh posts this file with
# exactly one substitution made (@IMAGE@) and nothing else.
#
# This file is the *shape* of the deployment and changes rarely; image.tag is the
# deploy and changes every time. Rollback is `git revert` of the commit that
# bumped image.tag.
#
#   ./deploy/control/apply.sh deploy/control/app.yaml
#
# Only the api runs here. The hardware service runs bare metal on the Pi and is
# deployed by hand with `make deploy-device`; it is never containerised.
#
# NOTE: literal values only, with exactly two exceptions.
#
# 1. `@IMAGE@`: substituted by apply.sh from deploy/control/image.tag BEFORE the
#    PUT, so what TrueNAS stores is still literal. A distinct sigil rather than
#    ${IMAGE} on purpose -- it cannot be mistaken for compose interpolation, and
#    apply.sh refuses to apply a manifest where it survives rendering.
#
# 2. The env_file mount below: an absolute host path read by docker compose at
#    run time on the control host, outside git like the secrets dir. It feeds
#    container ENV ONLY -- compose's env_file cannot interpolate compose-level
#    settings, so the values it carries are applied by the container itself at
#    start (see brewctl/core/container_net.py). Do not replace it with ${VAR}
#    placeholders: interpolation sources a .env from the project directory,
#    which TrueNAS manages -- it would expand empty.
#
# DEPLOY RULE: this file and deploy/control/image.tag move TOGETHER when the
# manifest starts referencing code the pinned image does not contain. An
# app.yaml-only deploy against an older image injects env vars nothing reads.

services:
  # The service name is load-bearing: Traefik's defaultRule on this host builds
  # the hostname from it.
  brewctl:
    # Rendered from deploy/control/image.tag, which is where deploys happen and where
    # the pinning rationale lives. Nothing to edit here to deploy.
    #
    # .forgejo/workflows/build.yml). Without it a typo'd tag hangs on a pull from
    # Docker Hub that can never succeed, instead of failing immediately.
    image: "@IMAGE@"
    pull_policy: never
    container_name: brewctl
    restart: unless-stopped

    ports:
      - "8000:8000"

    # enable=true is the whole opt-in, and the published port above stays: it is
    # what apply.sh's health gate and the container healthcheck both probe, so
    # losing it would make a deploy unverifiable.
    #
    # so the route is derived from the *compose service name* above -- which is
    # why that key is `brewctl` and not `api`.
    labels:
      - traefik.enable=true

    networks:
      - catacombs

    # The values that used to live here (dns server, influxdb hosts pin) are now
    # delivered by env_file below and applied by the container at start
    # (brewctl/core/container_net.py). env_file sets CONTAINER env -- it cannot
    # interpolate compose-level keys like dns:/extra_hosts:, and ${VAR}
    # interpolation would need a .env in the project directory, which TrueNAS
    # owns. Hence this indirection. KNOWN SEMANTICS DRIFT: the appended
    # nameserver is a glibc FALLBACK after Docker's embedded 127.0.0.11, not an
    # upstream of it -- .local names depend on host-inherited forwarders unless
    # pinned via BREWCTL_EXTRA_HOSTS. See the deploy plan's Architecture note.
    env_file:
      # Absolute path ON THE CONTROL HOST -- relative paths resolve against the
      # managed project dir, which we do not control. Missing file fails the
      # PUT validation loudly ("env file not found"); malformed values inside
      # make the api refuse to start. Lives outside git, beside the secrets dir.
      - /mnt/fast/apps/brewctl/env/brewctl.env

    environment:
      BREWCTL_MODE: api
      BREWCTL_IS_PROD: "true"

      # Host URLs live server-side in brewctl.env, next to the DNS/hosts pins
      # they depend on:
      #
      # BREWCTL_HARDWARE_URL -- the Pi, by IP (mDNS does not resolve from
      #   inside a container; keep a DHCP reservation). Unset/blank refuses
      #   to start when BREWCTL_IS_PROD=true (api/config.py).
      # BREWCTL_INFLUXDB_URL -- resolved via the BREWCTL_EXTRA_HOSTS pin.
      #   Unset only LOGS A WARNING and silently disables time series -- no
      #   startup guard, so verify it landed after any env_file change.
      BREWCTL_INFLUXDB_ORG: "catacombs"
      BREWCTL_INFLUXDB_BUCKET: "coldbrew"
      # Read from the mounted secret, so the token appears neither in this file
      # nor in `docker inspect`. The api refuses to start if it cannot read it.
      BREWCTL_INFLUXDB_TOKEN_FILE: /run/secrets/influxdb_token

      BREWCTL_VALVE_INTERVAL_SECONDS: "90"
      BREWCTL_TARGET_WEIGHT_GRAMS: "1337"
      BREWCTL_VESSEL_WEIGHT_GRAMS: "229"

      # AIBrewStrategy. Any OpenAI-compatible server works -- swapping the
      # backing service is the base URL and nothing else.
      #
      # phi4-mini is an instruct model: 90/100 on backend/scripts/bench_llm_strategy.py
      # with identical answers across all 10 repetitions of every case.
      #
      # Re-run that script before changing this, at >= 10 reps, and read the
      # per-case rows rather than the total. granite4:3b scores *higher* (91/100)
      # and answers BACKWARD to a normal below-target flow 8 times in 10 -- it
      # would drive the valve shut mid-brew. Aggregate accuracy hides that; the
      # per-case breakdown is the whole point of the script.
      #
      # Do not swap in a reasoning model (any qwen3/qwen3.5): forced to answer
      # without thinking they misread the tolerance band, and allowed to think
      # they take minutes per step.
      #
      # BREWCTL_LLM_BASE_URL is set server-side in brewctl.env (the same file
      # that feeds the DNS/hosts pins); unset falls back to http://localhost:11434
      BREWCTL_LLM_MODEL: "phi4-mini"

      # Both empty on purpose, and both are required. The api serves the UI itself
      # at /app, so requests are same-origin and CORS never applies.
      #
      # api/server.py composes the allow list as
      # BREWCTL_CORS_ORIGINS + [BREWCTL_FRONTEND_ORIGIN]; core/config.py defaults
      # the latter to http://localhost:5173. Clearing only the first still leaves
      # localhost advertised as an allowed origin with allow_credentials=True.
      BREWCTL_CORS_ORIGINS: ""
      BREWCTL_FRONTEND_ORIGIN: ""

    secrets:
      - influxdb_token

    healthcheck:
      # /api/health, NOT "/" -- "/" is a 307 to /app/, so a probe that follows it
      # reports on the static frontend bundle rather than on the api.
      # Checks the api itself, not the Pi: the api must stay up and reporting even
      # when the hardware service is unreachable, because that is how you find out.
      #
      # timeout=4 on urlopen is deliberate: without it the probe has no bound of its
      # own and relies on Docker SIGKILLing it at the 5s timeout below, which reads as
      # an unhealthy api rather than a slow dependency. The api's InfluxDB check is
      # separately bounded at 2s (see InfluxDBTimeSeries health_timeout).
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  catacombs:
    external: true

secrets:
  influxdb_token:
    # Path on the control host, root:root 0400. Created once during bootstrap; not
    # managed by this file -- apply.sh does not create it, and a missing or empty
    # file makes the api refuse to start (core/secrets.py raises rather than
    # falling back to an empty token).
    file: /mnt/fast/apps/brewctl/secrets/influxdb_token
